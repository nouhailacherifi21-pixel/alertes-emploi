name: Alertes emploi LinkedIn

on:
  schedule:
    # Toutes les 15 minutes, de 6h à 20h UTC (≈ 8h-22h à Paris en été, 7h-21h en hiver).
    # Dépôt public : les minutes GitHub Actions sont illimitées.
    - cron: "*/15 6-20 * * *"
  workflow_dispatch:
    inputs:
      max_age_minutes:
        description: "Âge max des offres en minutes, pour un test (vide = config.yaml ; 1440 = 24 h)"
        required: false
      test_email:
        description: "Envoyer seulement un email de test (oui / vide)"
        required: false
      resend:
        description: "Renvoyer les offres envoyées ces 48 dernières heures (oui / vide)"
        required: false

permissions:
  contents: write   # pour mémoriser les offres déjà envoyées (data/seen.json)

concurrency:
  group: alertes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier la configuration
        id: ready
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          for name in GMAIL_ADDRESS GMAIL_APP_PASSWORD NOTIFY_EMAIL ANTHROPIC_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Secret(s) manquant(s) :$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.ready.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Détecter et envoyer les nouvelles offres
        if: steps.ready.outputs.ok == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_AGE_MINUTES: ${{ inputs.max_age_minutes }}
        run: |
          set -o pipefail
          pip install -q -r requirements.txt
          if [ -n "${{ inputs.test_email }}" ]; then
            python -u -m src.alerts --test-email 2>&1 | tee data/last_run.log
          elif [ -n "${{ inputs.resend }}" ]; then
            python -u -m src.alerts --resend 2>&1 | tee data/last_run.log
          else
            python -u -m src.alerts 2>&1 | tee data/last_run.log
          fi

      - name: Mémoriser les offres envoyées
        if: always() && steps.ready.outputs.ok == 'true'
        run: |
          git config user.name "alertes-emploi"
          git config user.email "alertes-emploi@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Offres vues [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1

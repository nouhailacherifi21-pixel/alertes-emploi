# ─────────────────────────────────────────────────────────────
#  Alertes emploi LinkedIn — configuration
#  (les adresses email sont dans les secrets GitHub, pas ici)
# ─────────────────────────────────────────────────────────────

# Lieu : identifiant LinkedIn de l'Île-de-France (plus fiable que le texte seul).
_zone: &zone
  location: "Paris, Île-de-France, France"
  geo_id: 104246759
  job_type: [full_time, temporary]   # temps plein ; CDD courts écartés par le tri

# Recherches LinkedIn (titre ET description des offres), toutes lancées à chaque passage.
searches:
  - <<: *zone
    keywords: '"qualité des eaux" OR "qualité de l''eau" OR "chimie des eaux" OR "analyse des eaux" OR "analyses physico-chimiques" OR "laboratoire eau"'
  - <<: *zone
    keywords: '"traitement des eaux" OR "traitement de l''eau" OR "eau potable" OR "eaux usées" OR assainissement OR épuration OR "water treatment"'
  - <<: *zone
    keywords: '"ressources en eau" OR "gestion de l''eau" OR "milieux aquatiques" OR hydrobiologie OR hydrologie OR "gestion des milieux aquatiques"'
  - <<: *zone
    keywords: '"ingénieur eau" OR "ingénieur procédés eau" OR "ingénieur d''études eau" OR "chargé d''études eau" OR "chargé de mission eau" OR "ingénieur eau et assainissement"'
  - <<: *zone
    keywords: '"ingénieur laboratoire" OR "ingénieur chimiste" OR "chimiste analyticien" OR "métrologie laboratoire" OR "ingénieur métrologie" OR "ingénieur environnement"'

# Âge maximum des offres demandées à LinkedIn (minutes). Un passage toutes les
# 15 minutes : une heure laisse une marge en cas de retard de GitHub.
search_max_age_minutes: 60
max_pages: 2

# Annonces lues (et triées par Claude) au plus par passage ; les suivantes attendent
# le passage d'après.
max_fetch_per_run: 25

# Fraîcheur : offres ignorées si publiées il y a plus de N minutes (page de l'offre).
max_post_age_minutes: 60

# ── Exclusions immédiates sur l'intitulé (sans lire l'offre) ─
# Genre, accents et « (e) » sont gérés ; « * » = début de mot (technicien* → technicienne…).
title_excluded:
  - "stage"
  - "stagiaire"
  - "internship"
  - "intern"
  - "alternance"
  - "alternant"
  - "apprenti*"
  - "interim"
  - "interimaire"
  - "senior"
  - "sr"
  - "directeur"
  - "directrice"
  - "director"
  - "head of"
  - "technicien*"
  - "vendeur"

# ── Tri par Claude (lecture de chaque annonce) ───────────────
screen_model: "claude-haiku-5-5"
screen_workers: 6

# Une offre est retenue si ses MISSIONS relèvent d'au moins un de ces domaines,
# quel que soit son intitulé.
domains:
  - "Qualité des eaux / qualité de l'eau"
  - "Laboratoire d'analyses physico-chimiques des eaux"
  - "Ressources en eau / gestion de l'eau"
  - "Milieux aquatiques (hydrobiologie, écologie aquatique, hydrologie)"
  - "Chimie des eaux"
  - "Métrologie (laboratoire, mesures sur l'eau)"
  - "Procédés de traitement des eaux (eau potable, eaux usées, eaux industrielles, assainissement)"

# Profil (anonyme : le dépôt est public), utilisé pour la note d'adéquation.
profile: |
  Ingénieure chimiste, Bac+5 : Master Chimie parcours Traitement des Eaux (2024).
  Environ 1 an d'expérience en laboratoires d'analyse des eaux (laboratoire accrédité
  COFRAC / ISO 17025) : analyses physico-chimiques des eaux, chimie des eaux, validation
  des résultats, gestion des données sous LIMS, métrologie des équipements, contrôle
  qualité interne et cartes de contrôle, caractérisation de méthodes (NF T90-210),
  rédaction de rapports techniques avec recommandations (corrosion, entartrage,
  conditionnement des eaux de circuits). Connaissances approfondies des procédés de
  traitement des eaux (eaux urbaines et industrielles, essais Jar Test, optimisation) et
  des milieux aquatiques. Projet industriel d'optimisation du traitement de l'eau
  (méthodes spectroscopiques et chromatographiques). Esprit analytique et esprit de
  synthèse. Outils : LIMS, QGIS, XLStat, Excel. Anglais scientifique et technique.

# Préférences transmises à Claude.
preferences: |
  Le poste doit porter sur l'EAU : qualité des eaux, analyses physico-chimiques des eaux,
  chimie des eaux, ressources en eau, milieux aquatiques, métrologie ou procédés de
  traitement des eaux. Un poste de chimie, de laboratoire ou de R&D sans lien avec l'eau
  (pharmacie, cosmétique, matériaux, agroalimentaire…) n'est pas pertinent.
  Contrat : CDI, ou CDD longue durée (12 mois ou plus). À Paris ou en Île-de-France.
  Niveau : poste Bac+5 (ingénieure, chargée d'études ou de mission, cadre), idéalement
  en qualité et traitement des eaux, gestion de l'eau ou chimie des eaux ; pas de poste
  de technicien(ne), laborantin(e) ou d'agent.
  Profil junior : 3 ans d'expérience maximum demandés, fourchette comprise.

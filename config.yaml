# ─────────────────────────────────────────────────────────────
#  Alertes emploi LinkedIn — configuration
#  (les adresses email sont dans les secrets GitHub, pas ici)
# ─────────────────────────────────────────────────────────────

# Lieu : identifiant LinkedIn de l'Île-de-France (plus fiable que le texte seul).
_zone: &zone
  location: "Paris, Île-de-France, France"
  geo_id: 104246759
  job_type: [full_time]   # temps plein (CDI ; les CDD sont écartés plus bas)

# Recherches LinkedIn (titre ET description des offres), toutes lancées à chaque passage.
searches:
  - <<: *zone
    keywords: '"ingénieur chimiste" OR "ingénieure chimiste" OR "ingénieur chimie" OR chimiste OR "ingénieur R&D" OR "ingénieur formulation"'
  - <<: *zone
    keywords: '"ingénieur laboratoire" OR "ingénieur de laboratoire" OR "ingénieur analyse" OR "chimie analytique" OR "ingénieur métrologie"'
  - <<: *zone
    keywords: '"traitement des eaux" OR "traitement de l''eau" OR "ingénieur eau" OR "eau potable" OR "eaux usées" OR assainissement OR épuration OR "water treatment"'
  - <<: *zone
    keywords: '"ingénieur procédés" OR "ingénieur d''études" OR "chargé d''études" OR "process engineer"'

# Âge maximum des offres demandées à LinkedIn (minutes). Un passage toutes les
# 15 minutes : une heure laisse une marge en cas de retard de GitHub.
search_max_age_minutes: 60
max_pages: 2

# ── Filtre sur l'intitulé ────────────────────────────────────
# Une offre est retenue si son titre contient au moins un mot de CHAQUE liste.
# Genre, accents et « (e) » sont gérés ; « * » = début de mot (chimi* → chimie, chimiste…).
title_roles:
  - "ingenieur*"
  - "engineer*"
  - "charge"
  - "chimiste"
  - "chemist"
  - "scientist"
title_domains:
  - "chimi*"
  - "chemi*"
  - "laborato*"
  - "labo"
  - "eau"
  - "eaux"
  - "water"
  - "traitement"
  - "r d"
  - "recherche"
  - "formulation"
  - "procede*"
  - "process"
  - "analys*"
  - "analyti*"
  - "physico*"
  - "metrolog*"
  - "assainissement"
  - "epuration"
  - "hydro*"
  - "environnement*"
  - "potabil*"

# Offres écartées si leur titre contient l'un de ces mots.
title_excluded:
  - "stage"
  - "stagiaire"
  - "internship"
  - "intern"
  - "alternance"
  - "alternant"
  - "apprenti*"
  - "cdd"
  - "interim"
  - "interimaire"
  - "senior"
  - "sr"
  - "lead"
  - "directeur"
  - "directrice"
  - "director"
  - "head of"
  - "technicien*"
  - "commercial*"
  - "vendeur"

# ── Filtre sur l'annonce (lue seulement pour les offres retenues par le titre) ──
# Écartée si l'annonce parle d'un CDD ou d'intérim sans mentionner de CDI.
exclude_temporary_contracts: true
# Écartée si l'expérience minimale demandée dépasse ce nombre d'années.
max_years_experience: 3

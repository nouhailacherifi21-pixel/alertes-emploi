# ─────────────────────────────────────────────────────────────
#  Alertes emploi LinkedIn — configuration
#  (les adresses email sont dans les secrets GitHub, pas ici)
# ─────────────────────────────────────────────────────────────

# Lieu : identifiant LinkedIn de l'Île-de-France (plus fiable que le texte seul).
_zone: &zone
  location: "Paris, Île-de-France, France"
  geo_id: 104246759
  job_type: [full_time]   # temps plein (CDI ; les CDD sont écartés plus bas)

# Recherches LinkedIn (titre ET description des offres), toutes lancées à chaque passage.
searches:
  - <<: *zone
    keywords: '"ingénieur chimiste" OR "ingénieure chimiste" OR "ingénieur chimie" OR chimiste OR "ingénieur R&D" OR "ingénieur formulation"'
  - <<: *zone
    keywords: '"ingénieur laboratoire" OR "ingénieur de laboratoire" OR "ingénieur analyse" OR "chimie analytique" OR "ingénieur métrologie"'
  - <<: *zone
    keywords: '"traitement des eaux" OR "traitement de l''eau" OR "ingénieur eau" OR "eau potable" OR "eaux usées" OR assainissement OR épuration OR "water treatment"'
  - <<: *zone
    keywords: '"ingénieur procédés" OR "ingénieur d''études" OR "chargé d''études" OR "process engineer"'
  - <<: *zone
    keywords: '"ingénieur environnement" OR "qualité de l''eau" OR "ingénieur qualité" OR métrologie OR "ingénieur hydraulique" OR "chargé de mission eau"'

# Âge maximum des offres demandées à LinkedIn (minutes). Un passage toutes les
# 15 minutes : une heure laisse une marge en cas de retard de GitHub.
search_max_age_minutes: 60
max_pages: 2

# Annonces lues (et triées par Claude) au plus par passage ; les suivantes attendent
# le passage d'après.
max_fetch_per_run: 25

# Fraîcheur : offres ignorées si publiées il y a plus de N minutes (page de l'offre).
max_post_age_minutes: 60

# ── Exclusions immédiates sur l'intitulé (sans lire l'offre) ─
# Genre, accents et « (e) » sont gérés ; « * » = début de mot (technicien* → technicienne…).
title_excluded:
  - "stage"
  - "stagiaire"
  - "internship"
  - "intern"
  - "alternance"
  - "alternant"
  - "apprenti*"
  - "cdd"
  - "interim"
  - "interimaire"
  - "senior"
  - "sr"
  - "directeur"
  - "directrice"
  - "director"
  - "head of"
  - "technicien*"
  - "vendeur"

# ── Tri par Claude (lecture de chaque annonce) ───────────────
screen_model: "claude-haiku-5-5"
screen_workers: 6

# Une offre est retenue si ses MISSIONS relèvent d'au moins un de ces domaines,
# quel que soit son intitulé.
domains:
  - "Chimie / ingénierie chimiste"
  - "Laboratoire / analyses physico-chimiques, chimie analytique (chromatographie, spectroscopie)"
  - "Traitement des eaux : eau potable, eaux usées, eaux industrielles, assainissement, épuration"
  - "R&D / formulation / expérimentation"
  - "Procédés / génie des procédés / optimisation de traitement"
  - "Contrôle qualité et métrologie en laboratoire"
  - "Environnement / qualité de l'eau"

# Profil (anonyme : le dépôt est public), utilisé pour la note d'adéquation.
profile: |
  Ingénieure chimiste, Master Chimie parcours Traitement des Eaux (2024).
  Environ 1 an d'expérience en laboratoires d'analyse des eaux (laboratoire accrédité
  COFRAC / ISO 17025) : analyses physico-chimiques des eaux, validation des résultats,
  gestion des données sous LIMS, métrologie des équipements, contrôle qualité interne
  et cartes de contrôle, caractérisation de méthodes (NF T90-210), rédaction de rapports
  techniques avec recommandations (corrosion, entartrage, conditionnement des eaux de circuits).
  Projet industriel d'optimisation du traitement de l'eau (méthodes spectroscopiques et
  chromatographiques). Outils : LIMS, QGIS, XLStat, Excel. Anglais scientifique et technique.

# Préférences transmises à Claude.
preferences: |
  CDI uniquement, à Paris ou en Île-de-France.
  Postes d'ingénieure ou de cadre (ingénieur chimiste, ingénieur laboratoire, ingénieur en
  traitement des eaux, chargé de traitement des eaux, ingénieur d'études, ingénieur R&D) :
  pas de poste de technicien(ne), laborantin(e) ou d'agent.
  Profil junior : 3 ans d'expérience maximum demandés, fourchette comprise.
